<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login to Job Portal</title>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6fb;}
        .login-card { border-radius: 1rem; margin-top: 80px; background: #fff; box-shadow: 0 8px 24px 0 rgba(55, 100, 255, .07);}
    </style>
</head>
<body>
<div class="container py-5">
    <div class="card login-card shadow mx-auto" style="max-width: 400px;">
        <div class="card-body">
            <h2 class="text-center mb-4 text-primary fw-bold">Login</h2>
            <p class="text-center text-secondary">Administrator access</p>
            {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
            <form method="post">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input class="form-control" type="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" id="password" type="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
