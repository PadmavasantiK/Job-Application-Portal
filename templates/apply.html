<!DOCTYPE html>
<html lang="en"><head><title>Apply for {{ job.title }}</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5"><div class="card mx-auto" style="max-width: 560px"><div class="card-body p-4">
  <a href="/jobs" class="text-decoration-none">← Browse jobs</a><h1 class="h3 mt-3">Apply for {{ job.title }}</h1><p class="text-secondary">{{ job.location }}</p>
  {% if success %}<div class="alert alert-success">Application submitted. The portal administrator can track its status.</div><a class="btn btn-primary" href="/jobs">Back to jobs</a>
  {% else %}{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post"><label class="form-label" for="email">Registered applicant email</label><input class="form-control mb-3" id="email" name="email" type="email" required><button class="btn btn-success">Submit application</button></form>{% endif %}
</div></div></main></body></html>
