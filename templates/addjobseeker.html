<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Job Seeker</title>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6fb;}
        .side-nav { min-height: 100vh; background: #2563eb; color: #fff;}
        .side-nav .nav-link { color: #fff; font-size: 1.1rem;}
        .side-nav .nav-link.active, .side-nav .nav-link:hover { background: #1e40af; font-weight: 500;}
        .main-panel { background: #fff; border-radius: 15px; margin: 40px 0; box-shadow: 0 8px 32px rgba(25,40,130,0.08);}
    </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <nav class="col-lg-3 col-md-4 side-nav d-flex flex-column py-4">
      <h2 class="mb-4 ps-3 fw-bold border-bottom pb-2">Job Portal</h2>
      <ul class="nav flex-column">
        <li class="nav-item"><a href="/dashboard" class="nav-link">Dashboard</a></li>
        <li class="nav-item"><a href="/addjob" class="nav-link">Add Job</a></li>
        <li class="nav-item"><a href="/addjobseeker" class="nav-link active">Add Job Seeker</a></li>
        <li class="nav-item"><a href="/jobseekers" class="nav-link">View Job Seekers</a></li>
        <li class="nav-item"><a href="/applications" class="nav-link">View Applications</a></li>
        <li class="nav-item mt-2"><a href="/logout" class="nav-link text-warning">Logout</a></li>
      </ul>
    </nav>
    <main class="col-lg-9 col-md-8 py-4">
      <div class="main-panel p-4">
        <h2 class="mb-3 fw-bold">Add Job Seeker</h2>
        <form method="post">
            <div class="mb-3"><label class="form-label">User ID</label><input class="form-control" type="number" name="user_id" required></div>
            <div class="mb-3"><label class="form-label">First Name</label><input class="form-control" type="text" name="first_name" required></div>
            <div class="mb-3"><label class="form-label">Middle Name</label><input class="form-control" type="text" name="middle_name"></div>
            <div class="mb-3"><label class="form-label">Last Name</label><input class="form-control" type="text" name="last_name" required></div>
            <div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
            <div class="mb-3"><label class="form-label">Skills</label><input class="form-control" type="text" name="skills"></div>
            <div class="mb-3"><label class="form-label">Resume</label><input class="form-control" type="text" name="resume"></div>
            <button type="submit" class="btn btn-success">Add Seeker</button>
        </form>
        {% if error %}<div class="alert alert-danger mt-3">{{ error }}</div>{% endif %}
      </div>
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
